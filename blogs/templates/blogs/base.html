<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm mb-4 py-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Debby's Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="d-flex align-items-center ms-lg-auto justify-content-lg-end w-100 w-lg-auto mt-3 mt-lg-0">
          {% if not user.is_authenticated %}
          <a class="btn btn-outline-light me-2" href="{% url 'login' %}">Login</a>
          <a class="btn btn-light" href="{% url 'signup' %}">Sign Up</a>
          {% else%}
          <span class="navbar-text me-3">Hi, {{ user.username }}!</span>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit"
              class="btn btn-link nav-link text-white fw-semibold d-inline p-0 border-0">Logout</button>
          </form>
          {% endif %}
        </div>

      </div>
    </div>
  </nav>
  <header> {% block page_header %} {% endblock page_header %}</header>
  <main class="flex-grow-1"> {% block content %} {% endblock content %}</main>
  <footer class="bg-primary text-white text-center py-3 mt-4">
    <p>&copy; 2026 Debby's Blog. All rights reserved.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>


</html>
